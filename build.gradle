plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}
version = '1.9.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.232'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        coldpenguins { sourceSet sourceSets.main }
    }
}
